[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core-python"
version = "0.1.0"
description = "Python port of the agent-core runtime."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.setuptools.packages.find]
include = ["agent_core*", "agent_core_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Typed-contract-boundaries lane (package 22). Dev/CI tool only; the runtime
# stays dependency-free. Run: python3 -m mypy --config-file pyproject.toml
# Enforced (blocking) by tests/test_contracts_typecheck.py when mypy is
# installed; the test skips gracefully when it is not.
[tool.mypy]
files = ["agent_core/contracts"]
python_version = "3.10"
strict = true
warn_unreachable = true

# The lane is scoped to the typed boundaries: the rest of the runtime is
# deliberately Any-shaped (TypeScript-port idiom) and stays out of the gate.
[[tool.mypy.overrides]]
module = "agent_core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "agent_core.contracts.*"
ignore_errors = false

# Editor/Pylance lane: the runtime's merged-namespace idiom (vars(module).update
# in package __init__s) is invisible to static analysis and produces thousands of
# false positives, so type checking is off outside the mypy contracts lane above.
[tool.pyright]
typeCheckingMode = "off"
# Still surfaced as warnings in "off" mode; the merged namespace makes it pure noise.
reportUndefinedVariable = "none"